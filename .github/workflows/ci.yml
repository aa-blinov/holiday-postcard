name: ci

# Install, test, build. This project is static: the browser is the runtime and
# there is no bundler. The house-style check lives in its own workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check syntax
        run: node --check app.js

      - name: Check label contrast
        run: node tools/verify-contrast.mjs

      - name: Check HTML and CSS are present
        run: test -f index.html && test -f styles.css && test -f assets/favicon.svg
